# ==============================================================================
# Pricecol API Backend — Nginx Reverse Proxy Cache Configuration
# Cumple con:
# - EC-04 (Eficiencia de Desempeño <= 1.8s p95 para 500 usuarios concurrentes)
# - EC-02 (Revalidación condicional ETag -> 304 Not Modified contra Redis)
# - OWASP Web Cache Deception Prevention (jamás cachea rutas privadas o con Authorization)
# ==============================================================================

proxy_cache_path /var/cache/nginx/pricecol_api
                 levels=1:2
                 keys_zone=pricecol_api_cache:20m
                 max_size=512m
                 inactive=15m
                 use_temp_path=off;

upstream pricecol_django_upstream {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.pricecol.co localhost;

    client_max_body_size 6M;

    # Cabeceras de observabilidad del Proxy Cache (HIT, MISS, BYPASS, REVALIDATED, EXPIRED)
    add_header X-Cache-Status $upstream_cache_status always;

    # 1. Archivos Multimedia Inmutables (UUIDv4 sanitizados sin EXIF/GPS)
    location /media/ {
        proxy_pass http://pricecol_django_upstream;
        proxy_cache pricecol_api_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 2. Rutas Privadas y de Moderación — ESTRICTAMENTE SIN CACHÉ PROXY (Anti-Web-Cache-Deception)
    location ~ ^/api/v1/(auth|moderation|merchant)/ {
        proxy_pass http://pricecol_django_upstream;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Endpoints Públicos del Catálogo y Comparador Neutral (GET/HEAD con ETag + s-maxage)
    location /api/v1/ {
        proxy_pass http://pricecol_django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Activar zona de caché proxy solo para GET y HEAD
        proxy_cache pricecol_api_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";

        # Si el cliente envía ?mine=true, saltar el caché compartido
        proxy_cache_bypass $arg_mine;
        proxy_no_cache $arg_mine;

        # Revalidación condicional ultrarrápida mediante ETag (If-None-Match -> 304 Not Modified)
        proxy_cache_revalidate on;

        # Anti-Cache-Stampede: si 500 usuarios piden el mismo producto al expirar el caché,
        # solo 1 petición pasa a Django y las 499 restantes esperan el resultado.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # Resiliencia ante picos o reinicios (stale-while-revalidate / stale-if-error)
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }
}
