[project]
name = "pricecol-api-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.15.2",
    "djangorestframework-simplejwt>=5.4.0",
    "drf-spectacular>=0.28.0",
    "Pillow>=11.0.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pricecol_api_backend.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --cov=core_domain --cov-report=term-missing"

[tool.coverage.run]
source = ["core_domain"]
omit = ["core_domain/ports.py"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
ignore = ["RUF012"]
